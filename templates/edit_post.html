<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Post - My Blog</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            min-height: 250px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #222;
        }

    </style>

</head>


<body>

<header>

    <h1>Edit Post</h1>

    <p>Update your article</p>

</header>


<div class="container">

    <div class="form-box">

        <form method="POST">
            
            
            <label>Category</label>

<select name="category" required>

    {% for category in categories %}

        <option value="{{ category }}"
            {% if post['category'] == category %}
                selected
            {% endif %}>
            {{ category }}
        </option>

    {% endfor %}

</select>

            <label for="title">
                Post Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ post['title'] }}"
                required
            >


            <label for="author">
                Author
            </label>

            <input
                type="text"
                id="author"
                name="author"
                value="{{ post['author'] }}"
                required
            >


            <label for="content">
                Post Content
            </label>

            <textarea
                id="content"
                name="content"
                required
            >{{ post['content'] }}</textarea>


            <button type="submit">
                Update Post
            </button>

        </form>


        <a href="{{ url_for('post', post_id=post['id']) }}"
           class="back">

            ← Cancel

        </a>

    </div>

</div>

</body>

</html>
