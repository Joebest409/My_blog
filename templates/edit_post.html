<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Post - My Blog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header class="site-header">

    <div class="header-container">

        <h1>My Blog</h1>

        <nav>

            <a href="/">Home</a>

            <a href="/admin">Dashboard</a>

            <a href="/create-post">Create Post</a>

            <a href="/logout">Logout</a>

        </nav>

    </div>

</header>


<main class="container">

    <h2>Edit Post</h2>


    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <label for="title">
            Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ post['title'] }}"
            required
        >


        <label for="author">
            Author
        </label>

        <input
            type="text"
            id="author"
            name="author"
            value="{{ post['author'] }}"
            required
        >


        <label for="category">
            Category
        </label>

        <select
            id="category"
            name="category"
        >

            <option value="General"
                {% if post['category'] == 'General' %}
                    selected
                {% endif %}
            >
                General
            </option>

            <option value="Technology"
                {% if post['category'] == 'Technology' %}
                    selected
                {% endif %}
            >
                Technology
            </option>

            <option value="Education"
                {% if post['category'] == 'Education' %}
                    selected
                {% endif %}
            >
                Education
            </option>

            <option value="Business"
                {% if post['category'] == 'Business' %}
                    selected
                {% endif %}
            >
                Business
            </option>

            <option value="Health"
                {% if post['category'] == 'Health' %}
                    selected
                {% endif %}
            >
                Health
            </option>

            <option value="News"
                {% if post['category'] == 'News' %}
                    selected
                {% endif %}
            >
                News
            </option>

            <option value="Lifestyle"
                {% if post['category'] == 'Lifestyle' %}
                    selected
                {% endif %}
            >
                Lifestyle
            </option>

        </select>


        <label for="content">
            Content
        </label>

        <textarea
            id="content"
            name="content"
            rows="12"
            required
        >{{ post['content'] }}</textarea>


        {% if post['image'] %}

            <h3>Current Image</h3>

            <img
                src="{{ url_for(
                    'uploaded_file',
                    filename=post['image']
                ) }}"
                alt="Current post image"
                class="post-image"
            >

        {% endif %}


        <label for="image">
            Replace Image
        </label>

        <input
            type="file"
            id="image"
            name="image"
            accept=".jpg,.jpeg,.png,.gif,.webp"
        >


        <button type="submit">
            Update Post
        </button>

    </form>

</main>


<footer>

    <p>
        © 2026 My Blog. All rights reserved.
    </p>

</footer>

</body>

</html>
