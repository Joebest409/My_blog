{% extends "base.html" %}

{% block title %}
Change Admin Password
{% endblock %}

{% block content %}

<div class="card">

    <h1>🔑 Change Admin Password</h1>

    <form method="POST">

        <label>
            Current Password
        </label>

        <br>

        <input
            type="password"
            name="current_password"
            placeholder="Enter current password"
            required
        >

        <br><br>

        <label>
            New Password
        </label>

        <br>

        <input
            type="password"
            name="new_password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <br><br>

        <label>
            Confirm New Password
        </label>

        <br>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <br><br>

        <button type="submit">
            🔐 Change Password
        </button>

    </form>

</div>

<br>

<a
    class="button"
    href="{{ url_for('admin_dashboard') }}"
>
    ← Back to Dashboard
</a>

{% endblock %}
