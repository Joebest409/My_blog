<!DOCTYPE html>
<html>

<head>

    <title>Login - My Blog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>My Blog</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </nav>

</header>

<main>

    <h2>Login</h2>

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</main>

</body>

</html>
