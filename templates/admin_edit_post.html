{% extends "base.html" %}

{% block title %}
Edit Post - Admin
{% endblock %}

{% block content %}

<div class="card">

    <h1>✏️ Edit Post</h1>

    <form method="POST">

        <label>
            Title
        </label>

        <br>

        <input
            type="text"
            name="title"
            value="{{ post['title'] }}"
            required
        >

        <br><br>

        <label>
            Content
        </label>

        <br>

        <textarea
            name="content"
            rows="10"
            required
        >{{ post['content'] }}</textarea>

        <br><br>

        <label>
            Category
        </label>

        <br>

        <select name="category">

            {% for category in categories %}

                <option
                    value="{{ category }}"
                    {% if category == post['category'] %}
                        selected
                    {% endif %}
                >
                    {{ category }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            💾 Save Changes
        </button>

    </form>

</div>

<br>

<a
    class="button"
    href="{{ url_for('admin_dashboard') }}"
>
    ← Back to Dashboard
</a>

{% endblock %}
