<!DOCTYPE html>
<html>

<head>

    <title>Register - My Blog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <h1>My Blog</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
    </nav>

</header>


<main>

    <h2>Create Account</h2>

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>

</main>

</body>

</html>
