{% extends "base.html" %}

{% block title %}
Admin Registration
{% endblock %}

{% block content %}

<div class="card">

    <h1>🛠️ Admin Registration</h1>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Admin username"
            required
        >

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Admin password"
            required
        >

        <br><br>

        <button type="submit">
            Create Admin
        </button>

    </form>

</div>

{% endblock %}
