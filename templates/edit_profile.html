{% extends "base.html" %}

{% block content %}

<style>

.edit-profile-container {
    max-width: 650px;
    margin: 40px auto;
    padding: 0 15px;
}

.edit-profile-card {
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
}

.edit-profile-title {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
}

.profile-picture-section {
    text-align: center;
    margin-bottom: 30px;
}

.profile-picture,
.default-profile {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    margin-bottom: 15px;
}

.profile-picture {
    object-fit: cover;
    border: 4px solid #eee;
}

.default-profile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #eee;
    font-size: 55px;
    color: #777;
}

.upload-label {
    display: inline-block;
    background: #222;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 5px;
}

.upload-label:hover {
    opacity: 0.85;
}

#profile_picture {
    display: none;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

.form-group input:focus {
    border-color: #222;
}

.save-button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.save-button:hover {
    opacity: 0.85;
}

.password-section {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    text-align: center;
}

.password-section a {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: #555;
    padding: 10px 18px;
    border-radius: 8px;
}

.password-section a:hover {
    opacity: 0.85;
}

.back-profile {
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
    color: #555;
}

.back-profile:hover {
    text-decoration: underline;
}

@media (max-width: 600px) {

    .edit-profile-card {
        padding: 20px;
    }

    .profile-picture,
    .default-profile {
        width: 105px;
        height: 105px;
    }

}

</style>


<div class="edit-profile-container">

    <div class="edit-profile-card">

        <h1 class="edit-profile-title">
            ✏️ Edit Profile
        </h1>


        <!-- PROFILE PICTURE -->

        <div class="profile-picture-section">

            {% if user.profile_picture %}

                <img
                    id="profilePreview"
                    src="{{ url_for(
                        'static',
                        filename='profile_pictures/' + user.profile_picture
                    ) }}"
                    alt="Profile Picture"
                    class="profile-picture"
                >

            {% else %}

                <div
                    id="defaultProfile"
                    class="default-profile"
                >
                    👤
                </div>

                <img
                    id="profilePreview"
                    class="profile-picture"
                    style="display:none;"
                    alt="Profile Preview"
                >

            {% endif %}


            <!-- UPLOAD FORM -->

            <form
                method="POST"
                enctype="multipart/form-data"
                action="{{ url_for(
                    'upload_profile_picture',
                    username=user.username
                ) }}"
            >

                <label
                    for="profile_picture"
                    class="upload-label"
                >
                    🖼️ Choose Profile Picture
                </label>

                <input
                    type="file"
                    id="profile_picture"
                    name="profile_picture"
                    accept=".jpg,.jpeg,.png,.gif,.webp"
                    onchange="previewProfilePicture(event)"
                >

                <button
                    type="submit"
                    class="save-button"
                    style="margin-top: 12px;"
                >
                    Upload Picture
                </button>

            </form>

        </div>


        <!-- PROFILE INFORMATION -->

        <form
            method="POST"
            action="{{ url_for(
                'edit_profile',
                username=user.username
            ) }}"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ user.username }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ user.email }}"
                    required
                >

            </div>


            <button
                type="submit"
                class="save-button"
            >
                💾 Save Profile Changes
            </button>

        </form>


        <!-- PASSWORD -->

        <div class="password-section">

            <p>
                Want to change your password?
            </p>

            <a href="{{ url_for(
                'change_user_password',
                username=user.username
            ) }}">
                🔐 Change Password
            </a>

        </div>


        <!-- BACK -->

        <a
            href="{{ url_for(
                'profile',
                username=user.username
            ) }}"
            class="back-profile"
        >
            ← Back to Profile
        </a>

    </div>

</div>


<script>

function previewProfilePicture(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const preview = document.getElementById("profilePreview");
    const defaultProfile = document.getElementById("defaultProfile");

    preview.src = URL.createObjectURL(file);
    preview.style.display = "inline-block";

    if (defaultProfile) {
        defaultProfile.style.display = "none";
    }
}

</script>

{% endblock %}
