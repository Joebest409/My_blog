<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - My Blog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header class="site-header">

    <div class="header-container">

        <h1>My Blog</h1>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/profile">
                My Profile
            </a>

            {% if session.get("is_admin") == 1 %}

                <a href="/admin">
                    Admin Dashboard
                </a>

            {% endif %}

            <a href="/logout">
                Logout
            </a>

        </nav>

    </div>

</header>


<main class="container">

    <h2>
        Edit Profile
    </h2>


    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            value="{{ user['username'] }}"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ user['email'] }}"
            required
        >


        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Leave blank to keep current password"
        >
        
        {% if post["image"] %}

    <p>Current Image:</p>

    <img
        src="{{ url_for(
            'uploaded_file',
            filename=post['image']
        ) }}"
        alt="{{ post['title'] }}"
        class="post-image"
    >

{% endif %}


<label for="image">
    Replace Image
</label>

<input
    type="file"
    id="image"
    name="image"
    accept="image/png,image/jpeg,image/gif,image/webp"
>


        <button type="submit">
            Save Changes
        </button>

    </form>

</main>


<footer>

    <p>
        © 2026 My Blog. All rights reserved.
    </p>

</footer>

</body>

</html>
